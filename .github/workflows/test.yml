name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml pytest
      - run: npm install @xmldom/xmldom
      - run: python -m prlxml.fetch_schemas
      - run: python -m prlxml.convert samples/week1.csv -o /tmp/week1.xml
      - run: python -m prlxml.check /tmp/week1.xml --schemas schemas
      - run: python -m pytest -q tests
